<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OPENINGS IN NYC / MAY 29</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="top-bar">
        <div class="top-bar-main">
          <h1 id="site-title">OPENINGS IN NYC / MAY 29</h1>
          <div class="top-bar-actions">
            <span class="divider" aria-hidden="true">—</span>
            <button type="button" class="text-btn" id="refresh-btn">↻ Refresh</button>
          </div>
        </div>
        <p class="refresh-note" id="refresh-note" aria-live="polite"></p>
      </header>

      <div class="toolbar">
        <div class="segmented" role="tablist" aria-label="Show filter">
          <button type="button" class="segment active" data-filter="all" role="tab" aria-selected="true">All</button>
          <button type="button" class="segment" data-filter="saved" role="tab" aria-selected="false">
            Saved<span id="saved-count">0</span>
          </button>
        </div>
        <div class="segmented" role="tablist" aria-label="View mode">
          <button type="button" class="segment" data-view="list" role="tab" aria-selected="false">List</button>
          <button type="button" class="segment active" data-view="map" role="tab" aria-selected="true">Map</button>
        </div>
      </div>

      <div class="tier-bar" id="tier-filters" aria-label="Filter by venue type"></div>

      <main class="main-area">
        <section id="list-view" class="list-view hidden" aria-label="Show list"></section>
        <section id="map-view" class="map-view" aria-label="Map of gallery openings">
          <div id="map"></div>
        </section>
      </main>

      <aside id="detail-sheet" class="detail-sheet" aria-hidden="true">
        <button type="button" class="sheet-close" id="sheet-close" aria-label="Close details">×</button>
        <div id="detail-panel"></div>
      </aside>
      <div class="sheet-backdrop hidden" id="sheet-backdrop"></div>

      <footer class="site-footer">
        Source prototype data · Map © <a href="https://openstreetmap.org">OpenStreetMap</a> /
        <a href="https://carto.com/">CARTO</a>
      </footer>
    </div>

    <script src="js/data.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="js/app.js"></script>
  </body>
</html>
